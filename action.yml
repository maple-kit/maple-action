name: Maple visual review
description: Sync Maple's visual review comments onto a pull request, gate the merge until they are resolved, and lint the preview against the design tokens.
author: The Maple Authors

branding:
  icon: message-square
  color: red

inputs:
  mode:
    description: |
      "sync" writes the review comment onto the pull request.
      "gate" reports the maple/visual-review check run.
      "lint" lints the preview URL against the token files and reports the
      maple/design-lint check run and SARIF.
      Run sync before gate, so a blocked reviewer can see why.
    required: true
  branch:
    description: Branch or pull request the comments belong to. Defaults to the pull request's head ref.
    required: false
  token:
    description: |
      Token used for the API calls. sync needs pull-requests:write;
      gate needs checks:write and pull-requests:read; lint needs checks:write.
    required: false
    default: ${{ github.token }}
  require-approval:
    description: |
      "true" when a surface with nothing open still has to be approved by
      somebody in the overlay before it clears. Must match RouteOptions.
      requireApproval: the route and this action publish the same check name,
      so a disagreement lets a push clear a gate a reviewer is holding.
    required: false
    default: "false"
  app-id:
    description: |
      The App the token acts as. Only the App that created a check run may
      modify it, so the gate needs this to update its own run rather than
      abandon it. Defaults to GitHub Actions, which is what github.token is.
      Set it when you pass a token belonging to some other App.
    required: false
    default: "15368"
  preview-url:
    description: lint only. The deployed preview to lint. Required in lint mode.
    required: false
  token-files:
    description: lint only. Design token files in the repository, one per line or comma-separated. Required in lint mode.
    required: false
  viewports:
    description: lint only. Viewports to render at as WIDTHxHEIGHT, one per line or comma-separated, e.g. 1280x800. The CLI's default when empty.
    required: false
  bypass-header:
    description: |
      lint only. A "Name: value" header sent with every request, for a preview
      behind deployment protection. The value is masked in the log; pass it
      from a secret.
    required: false
  sarif-path:
    description: lint only. Where the SARIF file is written.
    required: false
    default: maple-design-lint.sarif

outputs:
  open-count:
    description: Number of comments holding the gate.
  conclusion:
    description: 'gate: "blocked", "clear" or "neutral", Maple''s verdict. lint: "success", "failure" or "neutral".'
  reason:
    description: Why the verdict was reached, e.g. "comments-open" or "no-review". Branch on this. Not set by lint.
  finding-count:
    description: lint only. Number of findings.
  sarif-path:
    description: lint only. The SARIF file written, for github/codeql-action/upload-sarif.
  check-run-id:
    description: lint only. The maple/design-lint check run, absent on a dry run.

runs:
  using: node24
  main: dist/index.js
