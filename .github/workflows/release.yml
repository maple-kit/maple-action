name: Release

# A release is cut by merging a pull request that bumps `version` in
# package.json. Nothing else tags, so the version in the repository and the tag
# users pin cannot drift apart.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version and check for an existing tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$version' is not a semantic version."
            exit 1
          fi
          {
            echo "version=$version"
            echo "major=${BASH_REMATCH[1]}"
            echo "prerelease=${BASH_REMATCH[2]:+true}"
          } >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already tagged; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.exists == 'false'
        uses: pnpm/action-setup@v4
      - if: steps.version.outputs.exists == 'false'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.version.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: The committed bundle is current
        if: steps.version.outputs.exists == 'false'
        # A release must never ship a bundle that differs from its source: the
        # tag is what `uses:` runs, and it runs dist/.
        run: |
          pnpm build
          git diff --exit-code -- dist/ \
            || { echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."; exit 1; }

      - name: Create the release
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        # `--target` makes gh create the tag on this commit, since it does not
        # exist yet. A prerelease is flagged so it is not shown as the latest.
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes "${flags[@]}"

      - name: Move the major tag
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.prerelease != 'true'
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        # `v0` is what `uses: maple-kit/maple-action@v0` follows, so it moves to
        # every stable release and never to a prerelease.
        run: |
          git tag -f "v${MAJOR}" "$GITHUB_SHA"
          git push -f origin "refs/tags/v${MAJOR}"
